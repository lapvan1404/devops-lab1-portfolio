
name: Portfolio CI/CD

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML files
        run: |
          test -f index.html
          test -f about.html
          test -f contact.html
          echo "All website pages exist."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
